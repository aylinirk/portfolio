backend:
  name: github
  repo: aylinirk/portfolio
  branch: main
  base_url: https://aylinirk.vercel.app
  auth_endpoint: api/auth
  # OAuth proxy required for production — see docs/superpowers/specs/ for setup notes

media_folder: src/assets/images
public_folder: /assets/images

collections:

  # ── Homepage content ────────────────────────────────────────
  - name: homepage
    label: "Homepage"
    files:
      - label: "Homepage (English)"
        name: homepage_en
        file: src/_data/homepage_en.json
        fields:
          - { label: Name, name: heroName, widget: string }
          - { label: Role line, name: heroRole, widget: string }
          - { label: Tagline, name: heroTagline, widget: text }
          - { label: Portrait caption, name: heroCaption, widget: string }
          - { label: CTA button text, name: heroCta, widget: string }
          - { label: Hero photo, name: heroPhoto, widget: image, required: false, allow_multiple: false }
          - { label: About quote, name: aboutQuote, widget: text }
          - label: Motto steps
            name: mottoParts
            widget: list
            fields:
              - { label: Lead-in, name: lead, widget: string }
              - { label: Large word, name: word, widget: string }
          - label: Stats
            name: stats
            widget: list
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Bio paragraphs
            name: bio
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - label: Skills
            name: skills
            widget: list
            field: { label: Skill, name: skill, widget: string }
          - label: Tools
            name: tools
            widget: list
            field: { label: Tool, name: tool, widget: string }
      - label: "Homepage (Deutsch)"
        name: homepage_de
        file: src/_data/homepage_de.json
        fields:
          - { label: Name, name: heroName, widget: string }
          - { label: Role line, name: heroRole, widget: string }
          - { label: Tagline, name: heroTagline, widget: text }
          - { label: Portrait caption, name: heroCaption, widget: string }
          - { label: CTA button text, name: heroCta, widget: string }
          - { label: Hero photo, name: heroPhoto, widget: image, required: false, allow_multiple: false }
          - { label: About quote, name: aboutQuote, widget: text }
          - label: Motto steps
            name: mottoParts
            widget: list
            fields:
              - { label: Lead-in, name: lead, widget: string }
              - { label: Large word, name: word, widget: string }
          - label: Stats
            name: stats
            widget: list
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
          - label: Bio paragraphs
            name: bio
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - label: Skills
            name: skills
            widget: list
            field: { label: Skill, name: skill, widget: string }
          - label: Tools
            name: tools
            widget: list
            field: { label: Tool, name: tool, widget: string }

  # ── Site settings ────────────────────────────────────────────
  - name: settings
    label: "Site Settings"
    files:
      - label: "Contact & Links"
        name: meta
        file: src/_data/meta.json
        fields:
          - { label: Site name, name: siteName, widget: string }
          - { label: Site description, name: siteDescription, widget: text }
          - { label: Site URL, name: siteUrl, widget: string }
          - { label: Contact email, name: contactEmail, widget: string }
          - { label: LinkedIn URL, name: linkedInUrl, widget: string }

  # ── Work case studies ───────────────────────────────────────
  - name: work_en
    label: "Work (English)"
    folder: src/en/work
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: case-study.njk }
      - { label: Title, name: title, widget: string }
      - { label: "Headline (*word* = serif accent, + = no space)", name: titleWords, widget: string }
      - { label: Card text, name: tagline, widget: text }
      - { label: Intro, name: lead, widget: text }
      - { label: Order, name: order, widget: number, default: 99, value_type: int }
      - label: Tags
        name: tags
        widget: list
        field: { label: Tag, name: tag, widget: string }
      - { label: Cover image, name: cover, widget: image }
      - { label: Cover description, name: coverAlt, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Scope, name: scope, widget: text }
      - { label: Tools, name: tools, widget: string }
      - { label: Year, name: year, widget: string }
      - { label: Outcomes heading, name: metricsHeading, widget: string, required: false }
      - { label: Outcomes note, name: metricsNote, widget: string, required: false }
      - label: Outcomes
        name: metrics
        widget: list
        fields:
          - { label: Value, name: value, widget: string }
          - { label: Label, name: label, widget: string }
      - label: Text blocks before the quote
        name: blocks
        widget: list
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Heading, name: heading, widget: string }
          - label: Paragraphs
            name: paras
            widget: list
            required: false
            field: { label: Text, name: text, widget: text }
          - label: Bullets
            name: bullets
            widget: list
            required: false
            field: { label: Text, name: text, widget: string }
          - label: Paragraphs after bullets
            name: after
            widget: list
            required: false
            field: { label: Text, name: text, widget: text }
      - { label: Insight quote, name: insightQuote, widget: text }
      - { label: Insight attribution, name: insightAttr, widget: string }
      - { label: Principles label, name: prinLabel, widget: string, required: false }
      - { label: Principles heading, name: prinHeading, widget: string }
      - label: Principles
        name: principles
        widget: list
        fields:
          - { label: Number, name: number, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: text }
      - { label: Process heading, name: procHeading, widget: string }
      - label: Process
        name: process
        widget: list
        fields:
          - { label: Number, name: number, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: text }
      - label: Galleries
        name: galleries
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text, required: false }
          - { label: Embedded page, name: embed, widget: string, required: false }
          - { label: Embed height (desktop), name: height, widget: number, value_type: int, required: false }
          - { label: Embed height (mobile), name: heightMobile, widget: number, value_type: int, required: false }
          - { label: Columns, name: columns, widget: number, value_type: int, required: false }
          - label: Images
            name: images
            widget: list
            required: false
            fields:
              - { label: Image, name: src, widget: image }
              - { label: Description, name: alt, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Caption, name: caption, widget: string }
      - label: Text blocks after the process
        name: blocks2
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Heading, name: heading, widget: string }
          - label: Paragraphs
            name: paras
            widget: list
            required: false
            field: { label: Text, name: text, widget: text }
          - label: Cards
            name: items
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
      - label: User quotes
        name: quotes
        widget: list
        required: false
        field: { label: Text, name: text, widget: string }
      - { label: "Reflection pull quote (*word* = serif accent)", name: pull, widget: text }
      - label: Reflection paragraphs
        name: reflection
        widget: list
        required: false
        field: { label: Text, name: text, widget: text }
      - label: Next steps paragraphs
        name: nextSteps
        widget: list
        required: false
        field: { label: Text, name: text, widget: text }


