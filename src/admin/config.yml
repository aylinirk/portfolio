          - { label: Heading, name: heading, widget: string }
          - { label: Intro, name: intro, widget: text, required: false }
          - { label: Embedded page, name: embed, widget: string, required: false }
          - { label: Embed height (desktop), name: height, widget: number, value_type: int, required: false }
          - { label: Embed height (mobile), name: heightMobile, widget: number, value_type: int, required: false }
          - { label: Columns, name: columns, widget: number, value_type: int, required: false }
          - label: Images
            name: images
            widget: list
            required: false
            fields:
              - { label: Image, name: src, widget: image }
              - { label: Description, name: alt, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Caption, name: caption, widget: string }
      - label: Text blocks after the process
        name: blocks2
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Heading, name: heading, widget: string }
          - label: Paragraphs
            name: paras
            widget: list
            required: false
            field: { label: Text, name: text, widget: text }
          - label: Cards
            name: items
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
      - label: User quotes
        name: quotes
        widget: list
        required: false
        field: { label: Text, name: text, widget: string }
      - { label: "Reflection pull quote (*word* = serif accent)", name: pull, widget: text }
      - label: Reflection paragraphs
        name: reflection
        widget: list
        required: false
        field: { label: Text, name: text, widget: text }
      - label: Next steps paragraphs
        name: nextSteps
        widget: list
        required: false
        field: { label: Text, name: text, widget: text }


  # ── Learning ────────────────────────────────────────────────
  - name: learning
    label: "Learning & Growth"
    files:
      - label: "Learning (English)"
        name: learning_en
        file: src/_data/learning_en.json
        fields:
          - label: Items
            name: items
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Platform, name: platform, widget: string }
              - label: Status
                name: status
                widget: select
                options:
                  - { label: Completed, value: Completed }
                  - { label: In Progress, value: "In Progress" }
                  - { label: Planned, value: Planned }
              - { label: Year, name: year, widget: string }
          - label: Semester
            name: semester
            widget: object
            fields:
              - { label: Kicker, name: kicker, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: sub, widget: text }
              - { label: Hours unit, name: unit, widget: string }
              - label: Stats
                name: stats
                widget: list
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - label: Learning areas
                name: groups
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Hours, name: hours, widget: number, value_type: int }
                  - label: Modules
                    name: modules
                    widget: list
                    fields:
                      - { label: Title, name: title, widget: string }
                      - { label: Hours, name: hours, widget: number, value_type: int }
      - label: "Lernen (Deutsch)"
        name: learning_de
        file: src/_data/learning_de.json
        fields:
          - label: Items
            name: items
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Platform, name: platform, widget: string }
              - label: Status
                name: status
                widget: select
                options:
                  - { label: Completed, value: Completed }
                  - { label: In Progress, value: "In Progress" }
                  - { label: Planned, value: Planned }
              - { label: Year, name: year, widget: string }
          - label: Semester
            name: semester
            widget: object
            fields:
              - { label: Kicker, name: kicker, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: sub, widget: text }
              - { label: Hours unit, name: unit, widget: string }
              - label: Stats
                name: stats
                widget: list
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - label: Learning areas
                name: groups
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Hours, name: hours, widget: number, value_type: int }
                  - label: Modules
                    name: modules
                    widget: list
                    fields:
                      - { label: Title, name: title, widget: string }
                      - { label: Hours, name: hours, widget: number, value_type: int }
