      - { label: Role, name: role, widget: string }
      - { label: Scope, name: scope, widget: text }
      - { label: Tools, name: tools, widget: string }
      - { label: Year, name: year, widget: string }
      - { label: Outcomes heading, name: metricsHeading, widget: string, required: false }
      - { label: Outcomes note, name: metricsNote, widget: string, required: false }
      - label: Outcomes
        name: metrics
        widget: list
        fields:
          - { label: Value, name: value, widget: string }
          - { label: Label, name: label, widget: string }
      - label: Text blocks before the quote
        name: blocks
