      - { label: Insight quote, name: insightQuote, widget: text }
      - { label: Insight attribution, name: insightAttr, widget: string }
      - { label: Principles label, name: prinLabel, widget: string, required: false }
      - { label: Principles heading, name: prinHeading, widget: string }
      - label: Principles
